[project]
name = "connected-fleet-rca"
version = "0.1.0"
description = "Host-simulated robot-vacuum fleet telemetry over MQTT with ML fault detection and root-cause analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "paho-mqtt>=2.0",
  "amqtt",
  "streamlit",
  "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
